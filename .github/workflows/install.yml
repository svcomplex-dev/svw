name: Installer smoke tests

on:
  repository_dispatch:
    types: [svw-release-ready]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Installer contract tests
        run: sh tests/install.sh
      - name: Install public latest and smoke test svw
        run: |
          set -eu
          test_root=$(mktemp -d)
          trap 'rm -rf "$test_root"' EXIT
          HOME="$test_root/home" sh install.sh \
            --bin-dir "$test_root/bin" \
            --install-root "$test_root/package" \
            --no-modify-path
          "$test_root/bin/svw" --version
          "$test_root/bin/svw" --help >/dev/null
